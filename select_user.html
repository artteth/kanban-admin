<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#667eea" />
  <title>Kanban v2 - Google Sheets</title>
  <style>
    * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: -webkit-linear-gradient(315deg, #667eea 0%, #764ba2 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      -webkit-box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      background: -webkit-linear-gradient(315deg, #667eea 0%, #764ba2 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    .sync-status {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
    }
    .sync-status.syncing { color: #ff9800; }
    .sync-status.ready { color: #4caf50; }
    .sync-status.error { color: #ff5252; }

    .user-list {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      margin-bottom: 24px;
    }
    .user-list > * + * { margin-top: 12px; }

    .user-card {
      background: #f5f7fa;
      border: 2px solid #e1e5eb;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    .user-card > * + * { margin-left: 12px; }

    .user-card:active {
      -webkit-transform: scale(0.98);
      transform: scale(0.98);
    }

    .user-card.touch-active {
      border-color: #667eea;
      background: #f0f4ff;
    }

    .user-card.selected {
      border-color: #667eea;
      background: -webkit-linear-gradient(315deg, #667eea 0%, #764ba2 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: -webkit-linear-gradient(315deg, #667eea 0%, #764ba2 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      font-weight: bold;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .user-card.selected .user-avatar {
      background: rgba(255,255,255,0.3);
    }

    .user-info {
      -webkit-flex: 1;
      flex: 1;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .user-card.selected .user-name {
      color: white;
    }

    .user-role {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .user-card.selected .user-role {
      color: rgba(255,255,255,0.8);
    }

    .user-actions {
      display: -webkit-flex;
      display: flex;
      opacity: 0;
      -webkit-transition: opacity 0.2s;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .user-actions > * + * { margin-left: 8px; }

    .user-card.selected .user-actions,
    .user-card.touch-active .user-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .user-action-btn {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      font-size: 16px;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-edit {
      background: #e3f2fd;
      color: #1976d2;
    }

    .btn-delete {
      background: #ffebee;
      color: #c62828;
    }

    .user-card.selected .btn-edit,
    .user-card.selected .btn-delete {
      background: rgba(255,255,255,0.3);
      color: white;
    }

    .add-user-btn {
      width: 100%;
      padding: 16px;
      border: 2px dashed #ccc;
      border-radius: 12px;
      background: transparent;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin-bottom: 24px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 56px;
    }
    .add-user-btn > * + * { margin-left: 8px; }

    .continue-btn {
      width: 100%;
      padding: 16px;
      background: -webkit-linear-gradient(315deg, #667eea 0%, #764ba2 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-transition: opacity 0.2s, -webkit-transform 0.2s;
      transition: opacity 0.2s, transform 0.2s;
      opacity: 0.5;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 56px;
    }

    .continue-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .admin-link {
      text-align: center;
      margin-top: 20px;
    }

    .admin-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      padding: 8px;
      display: inline-block;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: -webkit-flex;
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      -webkit-box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e1e5eb;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      -webkit-transition: border-color 0.2s;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .modal-buttons {
      display: -webkit-flex;
      display: flex;
      margin-top: 24px;
    }
    .modal-buttons > * + * { margin-left: 12px; }

    .modal-btn {
      -webkit-flex: 1;
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 48px;
    }

    .modal-btn-cancel {
      background: #f5f7fa;
      color: #666;
    }

    .modal-btn-save {
      background: -webkit-linear-gradient(315deg, #667eea 0%, #764ba2 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>&#128203; Kanban Board v2</h1>
      <p>Выберите пользователя для продолжения</p>
      <div class="sync-status" id="syncStatus">&#128260; Загрузка...</div>
    </div>

    <div id="userListContainer">
      <div class="loading">Загрузка...</div>
    </div>

    <button class="add-user-btn" onclick="openAddUserModal()">
      <span>&#10133;</span> <span>Добавить пользователя</span>
    </button>

    <button class="continue-btn" id="continueBtn" onclick="continueToBoard()">
      Продолжить &rarr;
    </button>

    <div class="admin-link">
      <a href="admin.html">&#128295; Админская панель</a>
    </div>
  </div>

  <!-- Add/Edit User Modal -->
  <div class="modal-overlay" id="userModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Новый пользователь</div>

      <div class="form-group">
        <label for="userName">Имя *</label>
        <input type="text" id="userName" placeholder="Введите имя" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="userTelegram">Telegram (необязательно)</label>
        <input type="text" id="userTelegram" placeholder="@username" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="userRole">Роль</label>
        <select id="userRole">
          <option value="user">Пользователь</option>
          <option value="admin">Админ</option>
        </select>
      </div>

      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeUserModal()">Отмена</button>
        <button class="modal-btn modal-btn-save" onclick="saveUser()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    // ===== GOOGLE SHEETS API CONFIGURATION =====
    var API_URL = 'https://script.google.com/macros/s/AKfycbwOmfbiY6qcoZtJJFyazXATEQKiVakQoFvRtVBwJbtGIFQUlhxFSiXlL89mI2_cxEg0/exec';

    var CURRENT_USER_KEY = 'kanban_current_user_v2';

    function setSyncStatus(status, message) {
      var el = document.getElementById('syncStatus');
      if (!el) return;
      el.className = 'sync-status ' + status;
      el.textContent = message;
    }

    // ===== Utilities =====
    function getTodayStr() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, '0');
      var d = String(now.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function generateId() {
      return 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    function generateUserId() {
      return 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== GOOGLE SHEETS API =====
    function apiJsonp(action, params) {
      params = params || {};
      return new Promise(function(resolve, reject) {
        var callbackName = 'jsonp_callback_' + Date.now();
        var urlParams = 'mode=jsonp&action=' + encodeURIComponent(action) + '&callback=' + callbackName;
        for (var key in params) {
          if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
            urlParams += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
          }
        }
        var url = API_URL + '?' + urlParams;

        var script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
          setSyncStatus('error', 'Ошибка сети');
          reject(new Error('JSONP request failed'));
        };

        window[callbackName] = function(response) {
          if (response && response.ok) {
            setSyncStatus('ready', 'Синхронизировано');
            setTimeout(function() { setSyncStatus('ready', ''); }, 3000);
            resolve(response.data || response);
          } else {
            // Fixed: no optional chaining for iOS 12
            var errMsg = (response && response.error) ? response.error : 'Неизвестная';
            setSyncStatus('error', 'Ошибка: ' + errMsg);
            reject(new Error((response && response.error) ? response.error : 'API error'));
          }
          delete window[callbackName];
          if (script.parentNode) { script.parentNode.removeChild(script); }
        };

        document.body.appendChild(script);
      });
    }

    function apiCall(action, payload) {
      payload = payload || {};
      setSyncStatus('syncing', 'Синхронизация...');
      return apiJsonp(action, payload).catch(function(e) {
        setSyncStatus('error', 'Ошибка сети');
        console.error('API call error:', e);
        throw e;
      });
    }

    function getUsers() {
      setSyncStatus('syncing', 'Загрузка пользователей...');
      return apiJsonp('getUsers')
        .then(function(result) {
          var users = Array.isArray(result) ? result : (result.ok ? (result.data || []) : []);
          setSyncStatus('ready', 'Загружено');
          setTimeout(function() { setSyncStatus('ready', ''); }, 2000);
          return users;
        })
        .catch(function(e) {
          setSyncStatus('error', 'Ошибка загрузки');
          console.error('getUsers error:', e);
          return [];
        });
    }

    function addUser(name, telegramId, role) {
      return apiCall('addUser', {
        name: name,
        telegramId: telegramId || '',
        role: role || 'user'
      }).catch(function(e) {
        console.error('addUser error:', e);
        throw e;
      });
    }

    function updateUser(userId, name, telegramId, role) {
      return apiCall('updateUser', {
        userId: userId,
        name: name,
        telegramId: telegramId || '',
        role: role || 'user'
      }).catch(function(e) {
        console.error('updateUser error:', e);
        throw e;
      });
    }

    function deleteUser(userId) {
      return apiCall('deleteUser', { userId: userId })
        .catch(function(e) {
          console.error('deleteUser error:', e);
          throw e;
        });
    }

    function addTask(title, plannedDate, assignedTo) {
      return apiCall('addTask', {
        title: title,
        plannedDate: plannedDate || '',
        assignedTo: assignedTo
      }).catch(function(e) {
        console.error('addTask error:', e);
        throw e;
      });
    }

    function updateTask(taskId, updates) {
      // Fixed: no object spread for iOS 10 — use Object.assign
      var payload = Object.assign({ id: taskId }, updates);
      return apiCall('updateTask', payload)
        .catch(function(e) {
          console.error('updateTask error:', e);
          throw e;
        });
    }

    function deleteTask(taskId) {
      return apiCall('deleteTask', { id: taskId })
        .catch(function(e) {
          console.error('deleteTask error:', e);
          throw e;
        });
    }

    // ===== State =====
    var users = [];
    var selectedUserId = null;
    var editingUserId = null;

    // ===== Load & Render =====
    function loadUsers() {
      setSyncStatus('syncing', 'Загрузка...');
      return getUsers().then(function(loadedUsers) {
        users = loadedUsers;
        renderUserList();
      });
    }

    function renderUserList() {
      var container = document.getElementById('userListContainer');

      if (!Array.isArray(users)) { users = []; }

      if (users.length === 0) {
        container.innerHTML =
          '<div class="loading">' +
            '<p>Пользователей пока нет</p>' +
            '<p style="margin-top: 8px; font-size: 13px; color: #888;">Нажмите "Добавить пользователя" чтобы создать первого</p>' +
          '</div>';
        return;
      }

      var html = '<div class="user-list">';

      for (var i = 0; i < users.length; i++) {
        var user = users[i];
        var avatarLetter = user.name.charAt(0).toUpperCase();
        var roleLabel = user.role === 'admin' ? '&#128081; Админ' : '&#128100; Пользователь';
        var isSelected = user.userId === selectedUserId ? 'selected' : '';

        var canDelete = user.role !== 'admin';
        if (!canDelete) {
          var adminCount = 0;
          for (var k = 0; k < users.length; k++) {
            if (users[k].role === 'admin') { adminCount++; }
          }
          canDelete = adminCount > 1;
        }

        html += '<div class="user-card ' + isSelected + '" data-user-id="' + user.userId + '">' +
          '<div class="user-avatar">' + avatarLetter + '</div>' +
          '<div class="user-info">' +
            '<div class="user-name">' + escapeHtml(user.name) + '</div>' +
            '<div class="user-role">' + roleLabel + (user.telegramId ? ' &bull; ' + escapeHtml(user.telegramId) : '') + '</div>' +
          '</div>' +
          '<div class="user-actions">' +
            '<button class="user-action-btn btn-edit" title="Редактировать">&#9999;&#65039;</button>' +
            (canDelete ? '<button class="user-action-btn btn-delete" title="Удалить">&#128465;&#65039;</button>' : '') +
          '</div>' +
        '</div>';
      }

      html += '</div>';
      container.innerHTML = html;

      // Attach events after rendering
      var cards = container.querySelectorAll('.user-card');
      for (var ci = 0; ci < cards.length; ci++) {
        (function(card) {
          var uid = card.getAttribute('data-user-id');

          // Touch events for iOS
          card.addEventListener('touchstart', function(e) {
            card.classList.add('touch-active');
          }, false);

          card.addEventListener('touchend', function(e) {
            e.preventDefault();
            card.classList.remove('touch-active');
            // Check if tapped on action button
            var target = e.target;
            if (target.classList.contains('btn-edit') || target.classList.contains('btn-delete')) {
              return;
            }
            selectUser(uid);
          }, false);

          card.addEventListener('click', function(e) {
            var target = e.target;
            if (target.classList.contains('btn-edit') || target.classList.contains('btn-delete')) {
              return;
            }
            selectUser(uid);
          });

          var editBtn = card.querySelector('.btn-edit');
          if (editBtn) {
            editBtn.addEventListener('touchend', function(e) {
              e.preventDefault();
              e.stopPropagation();
              openEditUserModal(uid);
            }, false);
            editBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              openEditUserModal(uid);
            });
          }

          var deleteBtn = card.querySelector('.btn-delete');
          if (deleteBtn) {
            deleteBtn.addEventListener('touchend', function(e) {
              e.preventDefault();
              e.stopPropagation();
              confirmDeleteUser(uid);
            }, false);
            deleteBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              confirmDeleteUser(uid);
            });
          }
        })(cards[ci]);
      }
    }

    function selectUser(userId) {
      selectedUserId = userId;
      renderUserList();
      var continueBtn = document.getElementById('continueBtn');
      continueBtn.classList.add('active');
    }

    function continueToBoard() {
      if (!selectedUserId) return;

      localStorage.setItem(CURRENT_USER_KEY, selectedUserId);

      var user = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].userId === selectedUserId) { user = users[i]; break; }
      }
      if (user && user.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html?userId=' + selectedUserId;
      }
    }

    // ===== Modal Functions =====
    function openAddUserModal() {
      editingUserId = null;
      document.getElementById('modalTitle').textContent = 'Новый пользователь';
      document.getElementById('userName').value = '';
      document.getElementById('userTelegram').value = '';
      document.getElementById('userRole').value = 'user';
      document.getElementById('userModal').classList.add('show');
      setTimeout(function() { document.getElementById('userName').focus(); }, 300);
    }

    function openEditUserModal(userId) {
      editingUserId = userId;
      var user = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].userId === userId) { user = users[i]; break; }
      }
      if (!user) return;

      document.getElementById('modalTitle').textContent = 'Редактирование';
      document.getElementById('userName').value = user.name || '';
      document.getElementById('userTelegram').value = user.telegramId || '';
      document.getElementById('userRole').value = user.role || 'user';
      document.getElementById('userModal').classList.add('show');
      setTimeout(function() { document.getElementById('userName').focus(); }, 300);
    }

    function closeUserModal() {
      document.getElementById('userModal').classList.remove('show');
      editingUserId = null;
    }

    function saveUser() {
      var name = document.getElementById('userName').value.trim();
      var telegramId = document.getElementById('userTelegram').value.trim();
      var role = document.getElementById('userRole').value;

      if (!name) { alert('Введите имя'); return; }

      var saveBtn = document.querySelector('#userModal .modal-btn-save');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохранение...';

      var promise;
      if (editingUserId) {
        promise = updateUser(editingUserId, name, telegramId, role);
      } else {
        promise = addUser(name, telegramId, role);
      }

      var wasEditing = editingUserId;
      promise
        .then(function() {
          closeUserModal();
          return loadUsers();
        })
        .then(function() {
          if (wasEditing && selectedUserId === wasEditing) {
            var updatedUser = null;
            for (var i = 0; i < users.length; i++) {
              if (users[i].userId === wasEditing) { updatedUser = users[i]; break; }
            }
            if (updatedUser) { selectedUserId = updatedUser.userId; }
          }
          if (!wasEditing) {
            alert('Пользователь "' + name + '" успешно добавлен!');
          }
        })
        .catch(function(e) {
          alert('Ошибка: ' + e.message);
        })
        .then(function() {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Сохранить';
        });
    }

    function confirmDeleteUser(userId) {
      if (!confirm('Вы уверены, что хотите удалить этого пользователя?')) return;

      deleteUser(userId)
        .then(function() {
          if (selectedUserId === userId) {
            selectedUserId = null;
            document.getElementById('continueBtn').classList.remove('active');
          }
          return loadUsers();
        })
        .catch(function(e) {
          alert('Ошибка при удалении: ' + e.message);
        });
    }

    // ===== Event Listeners =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        var modal = document.getElementById('userModal');
        if (modal.classList.contains('show')) { closeUserModal(); }
      }
    });

    document.getElementById('userModal').addEventListener('click', function(e) {
      if (e.target === this) { closeUserModal(); }
    });

    // ===== Initialization =====
    function init() {
      loadUsers();
    }

    init();
  </script>
</body>
</html>
