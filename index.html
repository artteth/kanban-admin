<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#667eea" />
  <title>Kanban v2 - Google Sheets</title>
  <style>
    * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #e8eef5;
      min-height: 100vh;
      padding: 16px;
    }
    .app { max-width: 1200px; margin: 0 auto; }

    /* Header */
    .app-header {
      background: -webkit-linear-gradient(315deg, #667eea 0%, #764ba2 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      /* gap: 12px — replaced below for iOS 12 */
      margin: 0 -6px 16px -6px;
      padding: 10px 14px;
    }
    .app-header > * {
      margin: 6px;
    }
    .header-left {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
    }
    .header-left > * + * { margin-top: 4px; }
    .app-title { font-size: 24px; font-weight: 600; }
    .user-badge { font-size: 13px; opacity: 0.9; }
    .header-right {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
    }
    .header-right > * + * { margin-left: 8px; }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: inline-block;
      text-decoration: none;
      text-align: center;
    }
    .btn-light {
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .btn-light:active { background: rgba(255,255,255,0.3); }
    .btn-success {
      background: #4caf50;
      color: white;
    }
    .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Loading & Status */
    .sync-status {
      font-size: 12px;
      opacity: 0.9;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      white-space: nowrap;
    }
    .sync-status.syncing { color: #ffeb3b; }
    .sync-status.ready { color: #4caf50; }
    .sync-status.error { color: #ff5252; }

    /* Settings */
    .settings-container {
      position: relative;
    }

    .settings-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 16px;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      color: white;
      -webkit-transition: all 0.3s;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      -webkit-box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      padding: 16px;
      z-index: 1000;
      min-width: 220px;
      border: 1px solid #e1e5eb;
    }

    .settings-dropdown.show {
      display: block;
    }

    .settings-dropdown h3 {
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .font-size-control {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 12px;
    }
    .font-size-control > * + * { margin-left: 8px; }

    .font-size-control button {
      padding: 6px 10px;
      border: 2px solid #667eea;
      border-radius: 6px;
      background: white;
      color: #667eea;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      min-width: 32px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .font-size-value {
      font-size: 13px;
      color: #333;
      min-width: 40px;
      text-align: center;
      font-weight: 500;
    }

    .bold-btn {
      width: 100%;
      padding: 8px;
      border: 2px solid #667eea;
      border-radius: 6px;
      background: white;
      color: #667eea;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      margin-bottom: 10px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .bold-btn.active {
      background: #667eea;
      color: white;
    }

    .reset-btn {
      width: 100%;
      padding: 8px;
      border: 2px solid #dc3545;
      border-radius: 6px;
      background: white;
      color: #dc3545;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .color-settings {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      margin-top: 8px;
    }
    .color-settings > * + * { margin-top: 8px; }

    .color-row {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      font-size: 13px;
    }
    .color-row > * + * { margin-left: 8px; }

    .color-row input[type="color"] {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
    }

    /* Board */
    .board {
      display: -webkit-grid;
      display: grid;
      -webkit-grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .column {
      background: #dee3ea;
      border-radius: 12px;
      padding: 16px;
      min-height: 500px;
    }

    .column-header {
      font-weight: 600;
      font-size: 16px;
      color: #333;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 8px;
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
    }

    .sort-btn {
      background: #90a4ae;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      -webkit-transition: background 0.2s;
      transition: background 0.2s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .sort-btn.active {
      background: #667eea;
    }

    .task-count {
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 14px;
      margin-left: 8px;
    }

    .task-list {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
    }
    .task-list > * + * { margin-top: 12px; }

    .task-card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      -webkit-box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      cursor: pointer;
      -webkit-transition: -webkit-transform 0.2s, -webkit-box-shadow 0.2s, opacity 0.2s;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      border-left: 4px solid #667eea;
      -webkit-tap-highlight-color: transparent;
    }

    /* Animations */
    @-webkit-keyframes cardArrive {
      0% { opacity: 0; -webkit-transform: translateY(-18px) scale(0.96); transform: translateY(-18px) scale(0.96); }
      60% { opacity: 1; -webkit-transform: translateY(4px) scale(1.01); transform: translateY(4px) scale(1.01); }
      100% { opacity: 1; -webkit-transform: translateY(0) scale(1); transform: translateY(0) scale(1); }
    }
    @keyframes cardArrive {
      0% { opacity: 0; -webkit-transform: translateY(-18px) scale(0.96); transform: translateY(-18px) scale(0.96); }
      60% { opacity: 1; -webkit-transform: translateY(4px) scale(1.01); transform: translateY(4px) scale(1.01); }
      100% { opacity: 1; -webkit-transform: translateY(0) scale(1); transform: translateY(0) scale(1); }
    }

    .task-card.just-arrived {
      -webkit-animation: cardArrive 0.35s ease forwards;
      animation: cardArrive 0.35s ease forwards;
    }

    @-webkit-keyframes syncPulse {
      0%, 100% { -webkit-box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 0 rgba(74,144,217,0.7); box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 0 rgba(74,144,217,0.7); }
      50% { -webkit-box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 12px rgba(74,144,217,0); box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 12px rgba(74,144,217,0); }
    }
    @keyframes syncPulse {
      0%, 100% { -webkit-box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 0 rgba(74,144,217,0.7); box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 0 rgba(74,144,217,0.7); }
      50% { -webkit-box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 12px rgba(74,144,217,0); box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 0 0 12px rgba(74,144,217,0); }
    }

    .task-card.syncing {
      -webkit-animation: syncPulse 1.2s ease-in-out infinite;
      animation: syncPulse 1.2s ease-in-out infinite;
    }

    .task-card.todo { border-left-color: #ff9800; }
    .task-card.in-progress { border-left-color: #2196f3; }
    .task-card.done { border-left-color: #4caf50; }

    /* Priority highlights */
    .task-card.planned-active {
      background: -webkit-linear-gradient(315deg, #fff3cd 0%, #fff9e6 100%);
      background: linear-gradient(135deg, #fff3cd 0%, #fff9e6 100%);
      border-left: 4px solid #ffc107 !important;
    }

    .task-card.planned-overdue {
      background: -webkit-linear-gradient(315deg, #ffdddd 0%, #ffe6e6 100%);
      background: linear-gradient(135deg, #ffdddd 0%, #ffe6e6 100%);
      border-left: 4px solid #dc3545 !important;
    }

    .task-card.planned-tomorrow {
      background: -webkit-linear-gradient(315deg, #fff3cd 0%, #fff9e6 100%);
      background: linear-gradient(135deg, #fff3cd 0%, #fff9e6 100%);
      border-left: 4px solid #ffc107 !important;
    }

    .task-planned-today {
      font-weight: 700 !important;
      color: #c62828 !important;
    }

    .task-planned-overdue {
      font-weight: 600 !important;
      color: #e65100 !important;
    }

    .task-title {
      font-size: var(--task-title-font-size, 15px);
      font-weight: var(--task-title-font-weight, normal);
      color: #333;
      margin-bottom: 10px;
      word-wrap: break-word;
    }

    .task-meta {
      font-size: var(--task-meta-font-size, 12px);
      font-weight: var(--task-meta-font-weight, normal);
      color: #888;
      margin-bottom: 8px;
    }

    .task-planned {
      font-size: var(--task-planned-font-size, 12px);
      font-weight: var(--task-planned-font-weight, normal);
      color: #667eea;
      margin-bottom: 8px;
    }

    .task-assignee {
      font-size: 12px;
      color: #666;
      background: #f5f7fa;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .task-actions {
      display: -webkit-flex;
      display: flex;
      margin-top: 12px;
    }
    .task-actions > * + * { margin-left: 8px; }

    .task-actions button {
      -webkit-flex: 1;
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #667eea;
      color: white;
      -webkit-transition: opacity 0.2s;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 44px;
    }

    .task-actions button:active {
      opacity: 0.8;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay.show {
      display: -webkit-flex;
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-textarea {
      width: 100%;
      padding: 16px;
      border: 2px solid #e1e5eb;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
      margin-bottom: 16px;
      -webkit-appearance: none;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e1e5eb;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      -webkit-appearance: none;
      background: white;
    }

    .modal-buttons {
      display: -webkit-flex;
      display: flex;
    }
    .modal-buttons > * + * { margin-left: 12px; }

    .modal-btn {
      -webkit-flex: 1;
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 48px;
    }

    .modal-btn-cancel {
      background: #f5f7fa;
      color: #666;
    }

    .modal-btn-add {
      background: #4caf50;
      color: white;
    }

    /* ===== Date Picker ===== */
    .date-picker-section {
      margin-bottom: 16px;
    }

    .date-picker-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .date-quick-btns {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      -webkit-align-items: center;
      align-items: center;
      margin: -4px;
    }

    .date-quick-btn {
      margin: 4px;
      padding: 10px 12px;
      border: 2px solid #e1e5eb;
      border-radius: 8px;
      background: white;
      color: #333;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      -webkit-transition: all 0.15s;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 40px;
    }

    .date-quick-btn.active {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }

    .date-selected-display {
      font-size: 13px;
      color: #667eea;
      font-weight: 600;
      margin-top: 8px;
    }

    /* Custom Date Picker Modal */
    .date-picker-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 3000;
    }

    .date-picker-modal.active { display: block; }

    .date-picker-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
    }

    .date-picker-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      -webkit-animation: slideUp 0.3s ease;
      animation: slideUp 0.3s ease;
    }

    @-webkit-keyframes slideUp {
      from { -webkit-transform: translateY(100%); transform: translateY(100%); }
      to { -webkit-transform: translateY(0); transform: translateY(0); }
    }
    @keyframes slideUp {
      from { -webkit-transform: translateY(100%); transform: translateY(100%); }
      to { -webkit-transform: translateY(0); transform: translateY(0); }
    }

    .date-picker-header {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .date-picker-nav {
      background: #f5f7fa;
      border: 1px solid #e1e5eb;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
      cursor: pointer;
      color: #333;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

    #currentMonthYear {
      font-size: 18px;
      font-weight: 600;
    }

    .date-picker-weekdays {
      display: -webkit-grid;
      display: grid;
      -webkit-grid-template-columns: repeat(7, 1fr);
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 10px;
    }

    .date-picker-weekdays span {
      font-size: 12px;
      color: #888;
      padding: 5px;
    }

    .date-picker-days {
      display: -webkit-grid;
      display: grid;
      -webkit-grid-template-columns: repeat(7, 1fr);
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      max-height: 300px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* aspect-ratio: 1 replaced with fixed height for iOS 12 */
    .date-picker-day {
      height: 36px;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      color: #333;
      -webkit-transition: all 0.2s;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .date-picker-day.selected {
      background: #667eea;
      color: white;
    }

    .date-picker-day.today {
      border: 2px solid #667eea;
    }

    .date-picker-day.other-month {
      opacity: 0.3;
    }

    .date-picker-day.disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .date-picker-actions {
      display: -webkit-flex;
      display: flex;
      margin-top: 20px;
    }
    .date-picker-actions > * + * { margin-left: 10px; }

    .date-picker-clear, .date-picker-close {
      -webkit-flex: 1;
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 44px;
    }

    .date-picker-clear {
      background: transparent;
      border: 1px solid #e1e5eb;
      color: #666;
    }

    .date-picker-close {
      background: #667eea;
      border: none;
      color: white;
    }

    @media (max-width: 768px) {
      .board { -webkit-grid-template-columns: 1fr; grid-template-columns: 1fr; }
      .app-header { -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: stretch; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <div class="app-title">&#128203; Kanban Board</div>
        <div class="user-badge" id="userBadge">&#128100; Загрузка...</div>
      </div>
      <div class="header-right">
        <span class="sync-status" id="syncStatus">&#128260; Синхронизация...</span>
        <a href="select_user.html" class="btn btn-light">&#128260; Сменить</a>
        <button class="btn btn-light" onclick="loadTasks()" title="Обновить">&#128260;</button>
        <div class="settings-container">
          <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()">&#9881;&#65039;</button>
          <div class="settings-dropdown" id="settingsDropdown">
            <h3>Заголовок задач</h3>
            <div class="font-size-control">
              <button onclick="changeFontSize('title', -2)">&#8722;</button>
              <span class="font-size-value" id="fontSizeValueTitle">16px</span>
              <button onclick="changeFontSize('title', 2)">+</button>
            </div>
            <button class="bold-btn" id="boldBtnTitle" onclick="toggleBold('title')">Жирный</button>

            <h3 style="margin-top: 12px;">Даты и длительность</h3>
            <div class="font-size-control">
              <button onclick="changeFontSize('meta', -2)">&#8722;</button>
              <span class="font-size-value" id="fontSizeValueMeta">13px</span>
              <button onclick="changeFontSize('meta', 2)">+</button>
            </div>
            <button class="bold-btn" id="boldBtnMeta" onclick="toggleBold('meta')">Жирные даты</button>

            <h3 style="margin-top: 12px;">Плановая дата</h3>
            <div class="font-size-control">
              <button onclick="changeFontSize('planned', -2)">&#8722;</button>

    <div class="board" id="board">
      <div class="loading">Загрузка...</div>

  <script>
    // ===== GOOGLE SHEETS API CONFIGURATION =====
    var API_URL = 'https://script.google.com/macros/s/AKfycbwOmfbiY6qcoZtJJFyazXATEQKiVakQoFvRtVBwJbtGIFQUlhxFSiXlL89mI2_cxEg0/exec';

    var CURRENT_USER_KEY = 'kanban_current_user_v2';

    function setSyncStatus(status, message) {
      var el = document.getElementById('syncStatus');
      if (!el) return;
      el.className = 'sync-status ' + status;
      el.textContent = message;
    }

    function getTodayStr() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, '0');
      var d = String(now.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function getDateOffsetStr(daysOffset) {
      var date = new Date();
      date.setDate(date.getDate() + daysOffset);
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function getDateOffsetStrFrom(baseStr, offsetDays) {
      var parts = baseStr.split('-');
      var y = Number(parts[0]);
      var mo = Number(parts[1]);
      var day = Number(parts[2]);
      var dt = new Date(y, mo - 1, day, 12, 0, 0);
      dt.setDate(dt.getDate() + offsetDays);
      var y2 = dt.getFullYear();
      var m2 = String(dt.getMonth() + 1).padStart(2, '0');
      var d2 = String(dt.getDate()).padStart(2, '0');
      return y2 + '-' + m2 + '-' + d2;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      var parts = dateStr.split('-');
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    }

    function formatDateWithDay(dateStr) {
      if (!dateStr) return '';
      var parts = dateStr.split('-');
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function generateId() {
      return 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    // ===== Date Picker State =====
    var selectedPlannedDays = null;
    var pickerYear, pickerMonth;

    // ===== Font Settings Config =====
    var FONT_SETTINGS = {
      title: {
        storageSizeKey: 'taskTitleFontSize',
        storageBoldKey: 'taskTitleFontBold',
        cssSizeVar: '--task-title-font-size',
        cssWeightVar: '--task-title-font-weight',
        defaultSize: 15,
        min: 12,
        max: 40,
        valueElementId: 'fontSizeValueTitle',
        boldButtonId: 'boldBtnTitle'
      },
      meta: {
        storageSizeKey: 'taskMetaFontSize',
        storageBoldKey: 'taskMetaFontBold',
        cssSizeVar: '--task-meta-font-size',
        cssWeightVar: '--task-meta-font-weight',
        defaultSize: 12,
        min: 10,
        max: 30,
        valueElementId: 'fontSizeValueMeta',
        boldButtonId: 'boldBtnMeta'
      },
      planned: {
        storageSizeKey: 'taskPlannedFontSize',
        storageBoldKey: 'taskPlannedFontBold',
        cssSizeVar: '--task-planned-font-size',
        cssWeightVar: '--task-planned-font-weight',
        defaultSize: 12,
        min: 10,
        max: 30,
        valueElementId: 'fontSizeValuePlanned',
        boldButtonId: 'boldBtnPlanned'
      }
    };

    // ===== Settings Functions =====
    function toggleSettings() {
      var dropdown = document.getElementById('settingsDropdown');
      dropdown.classList.toggle('show');
    }

    function changeFontSize(type, delta) {
      var cfg = FONT_SETTINGS[type];
      if (!cfg) return;
      var currentSize = parseInt(localStorage.getItem(cfg.storageSizeKey)) || cfg.defaultSize;
      var newSize = currentSize + delta;
      newSize = Math.max(cfg.min, Math.min(cfg.max, newSize));
      setFontSize(type, newSize);
    }

    function setFontSize(type, size) {
      var cfg = FONT_SETTINGS[type];
      if (!cfg) return;
      var root = document.documentElement;
      root.style.setProperty(cfg.cssSizeVar, size + 'px');
      localStorage.setItem(cfg.storageSizeKey, size);
      updateFontSizeDisplay(type, size);
    }

    function updateFontSizeDisplay(type, size) {
      var cfg = FONT_SETTINGS[type];
      if (!cfg) return;
      var valueEl = document.getElementById(cfg.valueElementId);
      if (valueEl) { valueEl.textContent = size + 'px'; }
    }

    function resetFontSettings() {
      Object.keys(FONT_SETTINGS).forEach(function(type) {
        var cfg = FONT_SETTINGS[type];
        setFontSize(type, cfg.defaultSize);
        localStorage.setItem(cfg.storageBoldKey, 'false');
        var root = document.documentElement;
        root.style.setProperty(cfg.cssWeightVar, 'normal');
        updateBoldButton(type, false);
      });
    }

    function toggleBold(type) {
      var cfg = FONT_SETTINGS[type];
      if (!cfg) return;
      var isBold = localStorage.getItem(cfg.storageBoldKey) === 'true';
      var newBold = !isBold;
      localStorage.setItem(cfg.storageBoldKey, newBold);
      var root = document.documentElement;
      root.style.setProperty(cfg.cssWeightVar, newBold ? 'bold' : 'normal');
      updateBoldButton(type, newBold);
    }

    function updateBoldButton(type, isBold) {
      var cfg = FONT_SETTINGS[type];
      if (!cfg) return;
      var btn = document.getElementById(cfg.boldButtonId);
      if (btn) { btn.classList.toggle('active', isBold); }
    }

    function loadFontSettings() {
      Object.keys(FONT_SETTINGS).forEach(function(type) {
        var cfg = FONT_SETTINGS[type];
        var savedSize = localStorage.getItem(cfg.storageSizeKey);
        var sizeToApply = savedSize ? parseInt(savedSize) : cfg.defaultSize;
        setFontSize(type, sizeToApply);
        var isBold = localStorage.getItem(cfg.storageBoldKey) === 'true';
        var root = document.documentElement;
        root.style.setProperty(cfg.cssWeightVar, isBold ? 'bold' : 'normal');
        updateBoldButton(type, isBold);
      });
    }

    function updateColumnColors() {
      var colors = {
        todo: {
          header: document.getElementById('todoHeaderColor').value,
          bg: document.getElementById('todoBgColor').value
        },
        inProgress: {
          header: document.getElementById('inProgressHeaderColor').value,
          bg: document.getElementById('inProgressBgColor').value
        },
        done: {
          header: document.getElementById('doneHeaderColor').value,
          bg: document.getElementById('doneBgColor').value
        }
      };
      localStorage.setItem('columnColors', JSON.stringify(colors));
      var root = document.documentElement;
      root.style.setProperty('--bg-todo-header', colors.todo.header);
      root.style.setProperty('--bg-progress-header', colors.inProgress.header);
      root.style.setProperty('--bg-done-header', colors.done.header);
      root.style.setProperty('--bg-todo', colors.todo.bg);
      root.style.setProperty('--bg-progress', colors.inProgress.bg);
      root.style.setProperty('--bg-done', colors.done.bg);
    }

    function loadColumnColors() {
      var saved = localStorage.getItem('columnColors');
      if (saved) {
        var colors = JSON.parse(saved);
        document.getElementById('todoHeaderColor').value = colors.todo.header;
        document.getElementById('todoBgColor').value = colors.todo.bg;
        document.getElementById('inProgressHeaderColor').value = colors.inProgress.header;
        document.getElementById('inProgressBgColor').value = colors.inProgress.bg;
        document.getElementById('doneHeaderColor').value = colors.done.header;
        document.getElementById('doneBgColor').value = colors.done.bg;
        updateColumnColors();
      }
    }

    // Close settings when clicking outside
    document.addEventListener('click', function(e) {
      var settingsContainer = document.querySelector('.settings-container');
      var dropdown = document.getElementById('settingsDropdown');
      if (settingsContainer && !settingsContainer.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    // ===== GOOGLE SHEETS API =====
    function apiJsonp(action, params) {
      params = params || {};
      return new Promise(function(resolve, reject) {
        var callbackName = 'jsonp_callback_' + Date.now();
        var urlParams = 'mode=jsonp&action=' + encodeURIComponent(action) + '&callback=' + callbackName;
        for (var key in params) {
          if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
            urlParams += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
          }
        }
        var url = API_URL + '?' + urlParams;

        var script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
          setSyncStatus('error', 'Ошибка сети');
          reject(new Error('JSONP request failed'));
        };

        window[callbackName] = function(response) {
          if (response && response.ok) {
            setSyncStatus('ready', 'Синхронизировано');
            setTimeout(function() { setSyncStatus('ready', ''); }, 3000);
            resolve(response.data || response);
          } else {
            // Fixed: no optional chaining for iOS 12
            var errMsg = (response && response.error) ? response.error : 'Неизвестная';
            setSyncStatus('error', 'Ошибка: ' + errMsg);
            reject(new Error((response && response.error) ? response.error : 'API error'));
          }
          delete window[callbackName];
          if (script.parentNode) { script.parentNode.removeChild(script); }
        };

        document.body.appendChild(script);
      });
    }

    function apiCall(action, payload) {
      payload = payload || {};
      setSyncStatus('syncing', 'Синхронизация...');
      return apiJsonp(action, payload).catch(function(e) {
        setSyncStatus('error', 'Ошибка сети');
        console.error('API call error:', e);
        throw e;
      });
    }

    function getUsers() {
      return fetch(API_URL + '?mode=tg-api&action=getUsers')
        .then(function(response) { return response.json(); })
        .then(function(result) { return result.ok ? (result.data || []) : []; })
        .catch(function(e) {
          console.error('getUsers error:', e);
          return [];
        });
    }

    function getTasks(userId) {
      userId = userId || null;
      var params = {};
      if (userId && userId !== 'admin') { params.userId = userId; }
      return apiJsonp('getTasks', params)
        .then(function(result) {
          return Array.isArray(result) ? result : (result.ok ? (result.data || []) : []);
        })
        .catch(function(e) {
          console.error('getTasks error:', e);
          return [];
        });
    }

    function addTask(title, plannedDate, assignedTo) {
      return apiCall('addTask', {
        title: title,
        plannedDate: plannedDate || '',
        assignedTo: assignedTo
      }).catch(function(e) {
        console.error('addTask error:', e);
        throw e;
      });
    }

    function updateTaskStatus(taskId, newStatus) {
      return apiCall('updateStatus', { id: taskId, status: newStatus })
        .catch(function(e) {
          console.error('updateTaskStatus error:', e);
          throw e;
        });
    }

    function deleteTask(taskId) {
      return apiCall('deleteTask', { id: taskId })
        .catch(function(e) {
          console.error('deleteTask error:', e);
          throw e;
        });
    }

    // ===== State =====
    var tasks = [];
    var currentUserId = null;
    var users = [];
    var sortState = { 'todo': null, 'in-progress': null, 'done': null };
    var pendingTaskIds = new Set();
    var AUTO_REFRESH_SECONDS = 30;
    var autoRefreshInterval = null;

    var statusLabels = {
      'todo': 'Задания',
      'in-progress': 'В работе',
      'done': 'Готово'
    };

    // ===== Load Data =====
    function loadUser() {
      // Manual URL param parsing for iOS 10 compatibility (no URLSearchParams)
      var search = window.location.search;
      var userIdParam = null;
      if (search) {
        var match = search.match(/[?&]userId=([^&]*)/);
        if (match) { userIdParam = decodeURIComponent(match[1]); }
      }
      currentUserId = userIdParam || localStorage.getItem(CURRENT_USER_KEY);

      if (!currentUserId) {
        window.location.href = 'select_user.html';
        return Promise.resolve();
      }

      setSyncStatus('syncing', 'Загрузка пользователей...');
      return getUsers().then(function(loadedUsers) {
        users = loadedUsers;
        var currentUser = null;
        for (var i = 0; i < users.length; i++) {
          if (users[i].userId === currentUserId) { currentUser = users[i]; break; }
        }
        if (currentUser) {
          document.getElementById('userBadge').textContent = currentUser.name + (currentUser.role === 'admin' ? ' (Админ)' : '');
        }
        return loadTasks();
      });
    }

    function loadTasks() {
      setSyncStatus('syncing', 'Загрузка задач...');
      return getTasks(currentUserId === 'admin' ? 'admin' : currentUserId)
        .then(function(loadedTasks) {
          tasks = loadedTasks;
          renderBoard();
        });
    }

    function startAutoRefresh() {
      if (autoRefreshInterval) { clearInterval(autoRefreshInterval); }
      autoRefreshInterval = setInterval(function() {
        getTasks(currentUserId === 'admin' ? 'admin' : currentUserId)
          .then(function(newTasks) {
            if (JSON.stringify(newTasks) !== JSON.stringify(tasks)) {
              tasks = newTasks;
              renderBoard();
              setSyncStatus('ready', 'Обновлено');
              setTimeout(function() { setSyncStatus('ready', ''); }, 2000);
            }
          })
          .catch(function(e) { console.error('Auto-refresh error:', e); });
      }, AUTO_REFRESH_SECONDS * 1000);
    }

    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
    }

    // ===== Board Rendering =====
    function renderBoard() {
      var board = document.getElementById('board');

      board.innerHTML =
        '<div class="column todo" data-status="todo">' +
          '<div class="column-header">' +
            '<span>&#128221; ' + statusLabels['todo'] + '<span class="task-count" id="countTodo">0</span></span>' +
            '<button class="sort-btn" data-status="todo" onclick="sortTasks(\'todo\')">&#128197;&#8593;&#8595;</button>' +
          '</div>' +
          '<div class="task-list" id="todo-tasks"></div>' +
        '</div>' +
        '<div class="column in-progress" data-status="in-progress">' +
          '<div class="column-header">' +
            '<span>&#128260; ' + statusLabels['in-progress'] + '<span class="task-count" id="countInProgress">0</span></span>' +
            '<button class="sort-btn" data-status="in-progress" onclick="sortTasks(\'in-progress\')">&#128197;&#8593;&#8595;</button>' +
          '</div>' +
          '<div class="task-list" id="in-progress-tasks"></div>' +
        '</div>' +
        '<div class="column done" data-status="done">' +
          '<div class="column-header">' +
            '<span>&#9989; ' + statusLabels['done'] + '<span class="task-count" id="countDone">0</span></span>' +
            '<button class="sort-btn" data-status="done" onclick="sortTasks(\'done\')">&#128197;&#8593;&#8595;</button>' +
          '</div>' +
          '<div class="task-list" id="done-tasks"></div>' +
        '</div>';

      var tasksToRender = tasks.slice();
      var today = getTodayStr();

      ['todo', 'in-progress'].forEach(function(status) {
        var statusTasks = tasksToRender.filter(function(t) { return t.status === status; });

        var activeGroup = statusTasks.filter(function(t) { return t.plannedDate && t.plannedDate <= today; });
        var futureGroup = statusTasks.filter(function(t) { return t.plannedDate && t.plannedDate > today; });
        var noDateGroup = statusTasks.filter(function(t) { return !t.plannedDate; });

        var overdueGroup = activeGroup.filter(function(t) { return t.plannedDate < today; });
        var todayGroup = activeGroup.filter(function(t) { return t.plannedDate === today; });

        overdueGroup.sort(function(a, b) { return a.plannedDate > b.plannedDate ? 1 : -1; });
        todayGroup.sort(function(a, b) { return a.plannedDate > b.plannedDate ? 1 : -1; });
        futureGroup.sort(function(a, b) { return a.plannedDate > b.plannedDate ? 1 : -1; });

        if (sortState[status]) {
          var sortFn = function(a, b) {
            var dateA = a.startDate ? new Date(a.startDate) : new Date(0);
            var dateB = b.startDate ? new Date(b.startDate) : new Date(0);
            return sortState[status] === 'asc' ? dateA - dateB : dateB - dateA;
          };
          todayGroup.sort(sortFn);
          overdueGroup.sort(sortFn);
          futureGroup.sort(sortFn);
          noDateGroup.sort(sortFn);
        }

        var sorted = todayGroup.concat(overdueGroup, futureGroup, noDateGroup);
        tasksToRender = tasksToRender.filter(function(t) { return t.status !== status; }).concat(sorted);
      });

      if (sortState['done']) {
        var doneTasks = tasksToRender.filter(function(t) { return t.status === 'done'; });
        doneTasks.sort(function(a, b) {
          var dateA = a.startDate ? new Date(a.startDate) : new Date(0);
          var dateB = b.startDate ? new Date(b.startDate) : new Date(0);
          return sortState['done'] === 'asc' ? dateA - dateB : dateB - dateA;
        });
        tasksToRender = tasksToRender.filter(function(t) { return t.status !== 'done'; }).concat(doneTasks);
      }

      var todoTasks = tasksToRender.filter(function(t) { return t.status === 'todo'; });
      var inProgressTasks = tasksToRender.filter(function(t) { return t.status === 'in-progress'; });
      var doneTasks2 = tasksToRender.filter(function(t) { return t.status === 'done'; });

      document.getElementById('countTodo').textContent = todoTasks.length;
      document.getElementById('countInProgress').textContent = inProgressTasks.length;
      document.getElementById('countDone').textContent = doneTasks2.length;

      todoTasks.forEach(function(task) { renderTask(task, 'todo-tasks'); });
      inProgressTasks.forEach(function(task) { renderTask(task, 'in-progress-tasks'); });
      doneTasks2.forEach(function(task) { renderTask(task, 'done-tasks'); });

      // Add drop handlers
      var columns = document.querySelectorAll('.column');
      for (var i = 0; i < columns.length; i++) {
        columns[i].addEventListener('dragover', handleDragOver);
        columns[i].addEventListener('drop', handleDrop);
      }

      // Update sort buttons
      var sortBtns = document.querySelectorAll('.sort-btn');
      for (var j = 0; j < sortBtns.length; j++) {
        var btn = sortBtns[j];
        var btnStatus = btn.dataset.status;
        if (sortState[btnStatus]) {
          btn.classList.add('active');
          btn.textContent = sortState[btnStatus] === 'asc' ? 'Дата ↑' : 'Дата ↓';
        }
      }
    }

    function sortTasks(status) {
      if (sortState[status] === null) {
        sortState[status] = 'asc';
      } else if (sortState[status] === 'asc') {
        sortState[status] = 'desc';
      } else {
        sortState[status] = null;
      }
      renderBoard();
    }

    function renderTask(task, appendToColumn) {
      var container;
      if (appendToColumn === true) {
        container = document.getElementById(task.status + '-tasks');
      } else {
        container = document.getElementById(appendToColumn);
      }
      if (!container) return;

      var card = document.createElement('div');
      card.className = 'task-card ' + task.status;
      card.draggable = true;
      card.dataset.id = task.id;

      if (task.plannedDate && task.status !== 'done') {
        var today = getTodayStr();
        var tomorrow = getDateOffsetStr(1);
        if (task.plannedDate < today) {
          card.classList.add('planned-overdue');
        } else if (task.plannedDate === today) {
          card.classList.add('planned-active');
        } else if (task.plannedDate === tomorrow) {
          card.classList.add('planned-tomorrow');
        }
      }

      var assignee = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].userId === task.assignedTo) { assignee = users[i]; break; }
      }
      var assigneeName = assignee ? assignee.name : 'Не назначен';

      var plannedDateHtml = '';
      if (task.plannedDate) {
        var todayStr = getTodayStr();
        var tomorrowStr = getDateOffsetStr(1);
        if (task.status === 'done') {
          plannedDateHtml = '<div class="task-planned">&#128204; Было на: ' + formatDateWithDay(task.plannedDate) + '</div>';
        } else if (task.plannedDate < todayStr) {
          plannedDateHtml = '<div class="task-planned task-planned-overdue">&#128204; Просрочено: ' + formatDate(task.plannedDate) + '</div>';
        } else if (task.plannedDate === todayStr) {
          plannedDateHtml = '<div class="task-planned task-planned-today">&#127919; СЕГОДНЯ!</div>';
        } else if (task.plannedDate === tomorrowStr) {
          plannedDateHtml = '<div class="task-planned">&#128197; Завтра!</div>';
        } else {
          plannedDateHtml = '<div class="task-planned">&#128197; ' + formatDateWithDay(task.plannedDate) + '</div>';
        }
      }

      var attachmentsHtml = '';
      if (task.attachments && task.attachments.length > 0) {
        var imgs = '';
        for (var a = 0; a < task.attachments.length; a++) {
          var att = task.attachments[a];
          if (att.type === 'image') {
            imgs += '<img src="' + att.url + '" style="height:60px;border-radius:6px;margin-right:6px;cursor:pointer;" onclick="window.open(\'' + att.url + '\', \'_blank\')" />';
          }
        }
        if (imgs) { attachmentsHtml = '<div class="task-attachments" style="margin-top:8px;">' + imgs + '</div>'; }
      }

      var actionsHtml = '<div class="task-actions">';
      if (task.status !== 'todo') {
        actionsHtml += '<button data-action="back" data-id="' + task.id + '">&larr; Назад</button>';
      }
      if (task.status !== 'done') {
        actionsHtml += '<button data-action="forward" data-id="' + task.id + '">Вперёд &rarr;</button>';
      }
      actionsHtml += '</div>';

      card.innerHTML =
        '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
        plannedDateHtml +
        '<div class="task-assignee">&#128100; ' + escapeHtml(assigneeName) + '</div>' +
        (task.startDate ? '<div class="task-meta">&#128197; Создано: ' + formatDate(task.startDate) + '</div>' : '') +
        (task.duration ? '<div class="task-meta">&#9201;&#65039; ' + task.duration + '</div>' : '') +
        attachmentsHtml +
        actionsHtml;

      card.addEventListener('dragstart', handleDragStart);
      card.addEventListener('dragend', handleDragEnd);

      var buttons = card.querySelectorAll('.task-actions button');
      for (var b = 0; b < buttons.length; b++) {
        buttons[b].addEventListener('click', function(e) {
          e.stopPropagation();
          var taskId = this.getAttribute('data-id');
          var action = this.dataset.action;
          if (action && taskId) { moveTask(taskId, action); }
        });
      }

      container.appendChild(card);
    }

    // ===== Task Movement =====
    function moveTask(taskId, direction) {
      var task = null;
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i].id === taskId) { task = tasks[i]; break; }
      }
      if (!task) return;

      var newStatus;
      if (direction === 'forward') {
        newStatus = task.status === 'todo' ? 'in-progress' : 'done';
      } else {
        newStatus = task.status === 'done' ? 'in-progress' : 'todo';
      }

      task.status = newStatus;
      pendingTaskIds.add(taskId);

      var oldCard = document.querySelector('.task-card[data-id="' + taskId + '"]');
      if (oldCard) { oldCard.remove(); }

      renderTask(task, true);

      var newCard = document.querySelector('.task-card[data-id="' + taskId + '"]');
      if (newCard) {
        newCard.classList.add('syncing');
        newCard.classList.add('just-arrived');
        var btns = newCard.querySelectorAll('button');
        for (var j = 0; j < btns.length; j++) { btns[j].disabled = true; }
      }

      apiJsonp('updateStatus', { id: taskId, status: newStatus })
        .then(function() {
          pendingTaskIds.delete(taskId);
          var card = document.querySelector('.task-card[data-id="' + taskId + '"]');
          if (card) {
            card.classList.remove('syncing');
            card.classList.remove('just-arrived');
            var btns2 = card.querySelectorAll('button');
            for (var k = 0; k < btns2.length; k++) { btns2[k].disabled = false; }
          }
        })
        .catch(function(err) {
          pendingTaskIds.delete(taskId);
          alert('Ошибка при перемещении: ' + err.message);
          loadTasks();
        });
    }

    // ===== Drag and Drop =====
    var draggedTaskId = null;

    function handleDragStart(e) {
      draggedTaskId = e.target.dataset.id;
      e.target.classList.add('dragging');
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
    }

    function handleDragOver(e) {
      e.preventDefault();
    }

    function handleDrop(e) {
      e.preventDefault();
      var newStatus = e.currentTarget.dataset.status;
      if (draggedTaskId && newStatus) {
        var task = null;
        for (var i = 0; i < tasks.length; i++) {
          if (tasks[i].id === draggedTaskId) { task = tasks[i]; break; }
        }
        if (task && task.status !== newStatus) {
          task.status = newStatus;
          pendingTaskIds.add(draggedTaskId);

          var oldCard = document.querySelector('.task-card[data-id="' + draggedTaskId + '"]');
          if (oldCard) { oldCard.remove(); }

          renderTask(task, true);

          var newCard = document.querySelector('.task-card[data-id="' + draggedTaskId + '"]');
          if (newCard) {
            newCard.classList.add('syncing');
            newCard.classList.add('just-arrived');
            var btns = newCard.querySelectorAll('button');
            for (var j = 0; j < btns.length; j++) { btns[j].disabled = true; }
          }

          var savedId = draggedTaskId;
          apiJsonp('updateStatus', { id: savedId, status: newStatus })
            .then(function() {
              pendingTaskIds.delete(savedId);
              var card = document.querySelector('.task-card[data-id="' + savedId + '"]');
              if (card) {
                card.classList.remove('syncing');
                card.classList.remove('just-arrived');
                var btns2 = card.querySelectorAll('button');
                for (var k = 0; k < btns2.length; k++) { btns2[k].disabled = false; }
              }
            })
            .catch(function(err) {
              pendingTaskIds.delete(savedId);
              alert('Ошибка при перемещении: ' + err.message);
              loadTasks();
            });
        }
      }
      draggedTaskId = null;
    }

    // ===== Date Picker Functions =====
    function selectPlannedDate(days) {
      var display = document.getElementById('dateSelectedDisplay');
      var btns = document.querySelectorAll('.date-quick-btn');

      if (selectedPlannedDays === days) {
        selectedPlannedDays = null;
        display.textContent = '';
        for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
        return;
      }

      selectedPlannedDays = days;
      var dateStr = getDateOffsetStr(days);

      for (var j = 0; j < btns.length; j++) {
        btns[j].classList.remove('active');
        if (parseInt(btns[j].dataset.days) === days) { btns[j].classList.add('active'); }
      }

      display.textContent = formatDateWithDay(dateStr);
    }

    function adjustPlannedDate(delta) {
      var display = document.getElementById('dateSelectedDisplay');
      var btns = document.querySelectorAll('.date-quick-btn');

      var current = document.getElementById('datePickerModal').dataset.current || getTodayStr();
      var newDate = getDateOffsetStrFrom(current, delta);
      document.getElementById('datePickerModal').dataset.current = newDate;

      selectedPlannedDays = 'custom';
      for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }

      display.textContent = formatDateWithDay(newDate);
    }

    function toggleDatePicker() {
      var modal = document.getElementById('datePickerModal');
      if (modal.classList.contains('active')) {
        closeDatePicker();
      } else {
        openDatePicker();
      }
    }

    function openDatePicker() {
      var currentValue = document.getElementById('datePickerModal').dataset.current || getTodayStr();
      var parts = currentValue.split('-');
      pickerYear = Number(parts[0]);
      pickerMonth = Number(parts[1]) - 1;
      renderDatePicker();
      document.getElementById('datePickerModal').classList.add('active');
    }

    function closeDatePicker() {
      document.getElementById('datePickerModal').classList.remove('active');
    }

    function renderDatePicker() {
      var months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      document.getElementById('currentMonthYear').textContent = months[pickerMonth] + ' ' + pickerYear;

      var todayStr = getTodayStr();
      var firstDay = new Date(pickerYear, pickerMonth, 1);
      var lastDay = new Date(pickerYear, pickerMonth + 1, 0);
      var startingDay = (firstDay.getDay() + 6) % 7;

      var html = '';
      var selectedValue = document.getElementById('datePickerModal').dataset.current || getTodayStr();

      var prevMonthLastDay = new Date(pickerYear, pickerMonth, 0).getDate();
      for (var i = startingDay - 1; i >= 0; i--) {
        var day = prevMonthLastDay - i;
        html += '<span class="date-picker-day other-month" data-day="' + day + '" data-month="' + (pickerMonth - 1) + '" data-year="' + pickerYear + '">' + day + '</span>';
      }

      for (var d = 1; d <= lastDay.getDate(); d++) {
        var dateStr = pickerYear + '-' + String(pickerMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        var classes = 'date-picker-day';
        if (dateStr === todayStr) { classes += ' today'; }
        if (dateStr === selectedValue) { classes += ' selected'; }
        if (dateStr < todayStr) { classes += ' disabled'; }
        html += '<span class="' + classes + '" data-day="' + d + '" data-month="' + pickerMonth + '" data-year="' + pickerYear + '">' + d + '</span>';
      }

      var remainingDays = 42 - (startingDay + lastDay.getDate());
      for (var r = 1; r <= remainingDays; r++) {
        html += '<span class="date-picker-day other-month" data-day="' + r + '" data-month="' + (pickerMonth + 1) + '" data-year="' + pickerYear + '">' + r + '</span>';
      }

      document.getElementById('datePickerDays').innerHTML = html;

      var days = document.querySelectorAll('.date-picker-day:not(.disabled)');
      for (var n = 0; n < days.length; n++) {
        days[n].addEventListener('click', function() {
          var dayNum = this.dataset.day;
          var monthNum = parseInt(this.dataset.month) + 1;
          var yearNum = this.dataset.year;
          var dStr = yearNum + '-' + String(monthNum).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
          document.getElementById('datePickerModal').dataset.current = dStr;
          document.getElementById('dateSelectedDisplay').textContent = formatDateWithDay(dStr);
          closeDatePicker();
        });
      }
    }

    document.getElementById('prevMonth').addEventListener('click', function() {
      pickerMonth--;
      if (pickerMonth < 0) { pickerMonth = 11; pickerYear--; }
      renderDatePicker();
    });

    document.getElementById('nextMonth').addEventListener('click', function() {
      pickerMonth++;
      if (pickerMonth > 11) { pickerMonth = 0; pickerYear++; }
      renderDatePicker();
    });

    document.getElementById('datePickerOverlay').addEventListener('click', closeDatePicker);
    document.getElementById('closeDatePicker').addEventListener('click', closeDatePicker);
    document.getElementById('clearDate').addEventListener('click', function() {
      document.getElementById('datePickerModal').dataset.current = '';
      document.getElementById('dateSelectedDisplay').textContent = '';
      selectedPlannedDays = null;
      var btns = document.querySelectorAll('.date-quick-btn');
      for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
      closeDatePicker();
    });

    // ===== Modal Functions =====
    function openAddTaskModal() {
      var modal = document.getElementById('addTaskModal');
      var textarea = document.getElementById('modalTaskInput');

      var select = document.getElementById('taskAssignee');
      select.innerHTML = '<option value="">Выберите исполнителя...</option>';

      for (var i = 0; i < users.length; i++) {
        var user = users[i];
        var option = document.createElement('option');
        option.value = user.userId;
        option.textContent = user.name + (user.role === 'admin' ? ' (Админ)' : '');
        select.appendChild(option);
      }

      if (currentUserId) { select.value = currentUserId; }

      currentTaskIdForUpload = null;
      document.getElementById('taskAttachments').innerHTML = '';
      document.getElementById('imageUploadStatus').textContent = '';

      textarea.value = '';
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';

      modal.classList.add('show');
      setTimeout(function() { textarea.focus(); }, 300);
    }

    function closeAddTaskModal() {
      var modal = document.getElementById('addTaskModal');
      var textarea = document.getElementById('modalTaskInput');
      modal.classList.remove('show');
      textarea.value = '';
      document.getElementById('dateSelectedDisplay').textContent = '';
      selectedPlannedDays = null;
      var btns = document.querySelectorAll('.date-quick-btn');
      for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
      document.getElementById('datePickerModal').dataset.current = '';
    }

    function submitTaskFromModal() {
      var textarea = document.getElementById('modalTaskInput');
      var title = textarea.value.trim();
      var assignedTo = document.getElementById('taskAssignee').value;
      var plannedDate = document.getElementById('datePickerModal').dataset.current || '';

      if (!title) { alert('Введите описание задачи'); return; }
      if (!assignedTo) { alert('Выберите исполнителя'); return; }

      var submitBtn = document.querySelector('#addTaskModal .modal-btn-add');
      var originalBtnText = submitBtn.textContent;
      submitBtn.textContent = 'Сохранение...';
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      addTask(title, plannedDate, assignedTo)
        .then(function() {
          closeAddTaskModal();
          return loadTasks();
        })
        .catch(function(e) {
          alert('Ошибка при добавлении задачи: ' + e.message);
        })
        .then(function() {
          submitBtn.textContent = originalBtnText;
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
        });
    }

    // ===== Image Upload Functions =====
    var currentTaskIdForUpload = null;

    function handleImageUpload(event) {
      var file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert('Файл слишком большой. Максимум 5MB');
        return;
      }

      var statusEl = document.getElementById('imageUploadStatus');
      statusEl.textContent = 'Загрузка...';

      readFileAsBase64(file)
        .then(function(base64) {
          return apiCall('uploadImageToDrive', {
            base64Data: base64,
            fileName: file.name || 'image.jpg',
            taskId: currentTaskIdForUpload || 'temp'
          });
        })
        .then(function(uploadResult) {
          if (uploadResult.ok && uploadResult.data) {
            return apiCall('addImageToTask', {
              taskId: currentTaskIdForUpload,
              imageUrl: uploadResult.data.directUrl,
              imageName: file.name
            }).then(function(addResult) {
              if (addResult.ok) {
                statusEl.textContent = 'Фото загружено!';
                renderAttachments(addResult.data);
                setTimeout(function() { statusEl.textContent = ''; }, 3000);
              }
            });
          } else {
            var errMsg = (uploadResult && uploadResult.error) ? uploadResult.error : 'Неизвестная';
            statusEl.textContent = 'Ошибка: ' + errMsg;
          }
        })
        .catch(function(e) {
          console.error('Image upload error:', e);
          statusEl.textContent = 'Ошибка загрузки';
        });

      event.target.value = '';
    }

    function readFileAsBase64(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderAttachments(attachments) {
      var container = document.getElementById('taskAttachments');
      if (!container) return;

      if (!attachments || attachments.length === 0) {
        container.innerHTML = '';
        return;
      }

      var html = '';
      for (var i = 0; i < attachments.length; i++) {
        var att = attachments[i];
        if (att.type === 'image') {
          html += '<div style="position:relative;display:inline-block;margin:4px;">' +
            '<img src="' + att.url + '" style="height:80px;border-radius:8px;cursor:pointer;" onclick="window.open(\'' + att.url + '\', \'_blank\')" />' +
            '<button onclick="removeAttachment(' + i + ')" style="position:absolute;top:-8px;right:-8px;background:#dc3545;color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;">&#215;</button>' +
          '</div>';
        }
      }
      container.innerHTML = html;
    }

    function removeAttachment(index) {
      if (!currentTaskIdForUpload) return;
      if (!confirm('Удалить это фото?')) return;

      apiCall('removeImageFromTask', { id: currentTaskIdForUpload, index: index })
        .then(function(result) {
          if (result.ok) { renderAttachments(result.data); }
        })
        .catch(function(e) {
          alert('Ошибка при удалении: ' + e.message);
        });
    }

    // ===== Event Listeners =====
    document.getElementById('openAddModal').addEventListener('click', openAddTaskModal);
    document.getElementById('addTaskModal').addEventListener('click', function(e) {
      if (e.target === this) { closeAddTaskModal(); }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        var modal = document.getElementById('addTaskModal');
        if (modal.classList.contains('show')) { closeAddTaskModal(); }
      }
    });

    // ===== Initialization =====
    function init() {
      loadFontSettings();
      loadColumnColors();
      loadUser().then(function() {
        startAutoRefresh();
      });
    }

    init();
  </script>
</body>
